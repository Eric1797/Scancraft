[package]
name = "scancraft-scan-wia"
description = "Windows WIA 2.0 scanner backend (STA COM). Ported from NAPS2 (GPL-2.0-or-later)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
# OS-binding crate: reviewed `unsafe` lives here (each block has a SAFETY
# comment), so the workspace-wide `unsafe_code = "forbid"` is not inherited.
clippy.dbg_macro = "warn"
clippy.todo = "warn"

[target.'cfg(windows)'.dependencies]
scancraft-model = { workspace = true }
scancraft-scan-core = { workspace = true }
scancraft-imaging = { workspace = true }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_ImageAcquisition",
] }
