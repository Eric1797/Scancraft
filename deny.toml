# cargo-deny policy (mirrors PdfCraft's, plus GPL for this project).
# NAPS2-derived scan code is GPL-2.0-or-later; AGPL/LGPL code is never linked.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
# code dependencies: permissive licences, plus GPL-2.0-or-later (this
# project is GPL; NAPS2-derived code is GPL-compatible by license).
# Copyleft-incompatible (AGPL, LGPL-linked) code is never linked.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences
# on the asset allowlist, attributed in ATTRIBUTION.toml as
# dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
